<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gamesi - Counter Arena</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.wrap {
  max-width: 1000px;
  margin: auto;
  padding: 12px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

h1 {
  margin: 8px 0;
}

.info {
  color: #aeb6ca;
  font-size: 14px;
}

canvas {
  display: block;
  width: min(100%, 900px);
  height: auto;
  margin: 12px auto;
  border: 2px solid #30384e;
  border-radius: 12px;
  background: #161a21;
  cursor: crosshair;
}

button {
  background: #293147;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #3b4764;
}

.hud {
  font-size: 18px;
}

</style>
</head>

<body>

<div class="wrap">

<div class="top">

<h1>🎯 Counter Arena</h1>

<div class="hud">

Round:
<span id="round">1</span>

· Score:
<span id="score">0</span>

· HP:
<span id="hp">100</span>

</div>

<button onclick="restart()">
Restart
</button>

<button id="soundBtn"
onclick="toggleSound()">
🔊 Sound: On
</button>

</div>

<br>

<button onclick="goHome()">
🏠 Home
</button>

<div class="info">

WASD move · Mouse aim · Click fire · R reload

</div>

<canvas
id="game"
width="900"
height="560">
</canvas>

<div class="info">
Tactical arena with training bots. No gore.
</div>

</div>


<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


const keys = {};

const player = {

  x: 450,

  y: 470,

  r: 13,

  hp: 100,

  ammo: 12,

  max: 12,

  reloading: false

};


let bots = [];

let score = 0;

let round = 1;

let gameOver = false;

let last = 0;

let spawnTimer = 0;

let mouse = {
  x: 450,
  y: 280
};

let flash = 0;


/* AUDIO */

let soundOn = true;

let audioCtx = null;

let musicTimer = null;

let musicStep = 0;


function audio() {

  if (!audioCtx) {

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (
    audioCtx.state ===
    "suspended"
  ) {

    audioCtx.resume();

  }

  return audioCtx;

}


function tone(
  frequency,
  duration = 0.07,
  type = "square",
  volume = 0.025
) {

  if (!soundOn) return;

  const a = audio();

  const oscillator =
    a.createOscillator();

  const gain =
    a.createGain();

  oscillator.type = type;

  oscillator.frequency.value =
    frequency;

  gain.gain.value =
    volume;

  oscillator.connect(gain);

  gain.connect(a.destination);

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    a.currentTime + duration
  );

  oscillator.start();

  oscillator.stop(
    a.currentTime + duration
  );

}


function startMusic() {

  if (
    !soundOn ||
    musicTimer
  ) return;

  audio();

  const notes = [
    146.8,
    174.6,
    196,
    174.6,
    130.8,
    164.8,
    196,
    164.8
  ];

  musicTimer =
    setInterval(() => {

      tone(
        notes[
          musicStep++ %
          notes.length
        ],
        0.12,
        "triangle",
        0.012
      );

    }, 300);

}


function stopMusic() {

  clearInterval(
    musicTimer
  );

  musicTimer = null;

}


function toggleSound() {

  soundOn = !soundOn;

  document.getElementById(
    "soundBtn"
  ).textContent =
    soundOn
      ? "🔊 Sound: On"
      : "🔇 Sound: Off";

  if (soundOn) {

    startMusic();

  } else {

    stopMusic();

  }

}


/* HOME */

function goHome() {

  stopMusic();

  window.location.href =
    "index.html";

}


/* INPUT */

addEventListener(
  "keydown",
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;

    audio();

    startMusic();

    if (
      e.key.toLowerCase() ===
      "r"
    ) {

      reload();

    }

    if (
      gameOver &&
      e.key === "Enter"
    ) {

      restart();

    }

  }
);


addEventListener(
  "keyup",
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;

  }
);


canvas.addEventListener(
  "mousemove",
  e => {

    const rect =
      canvas.getBoundingClientRect();

    mouse.x =
      (e.clientX - rect.left) *
      canvas.width /
      rect.width;

    mouse.y =
      (e.clientY - rect.top) *
      canvas.height /
      rect.height;

  }
);


canvas.addEventListener(
  "mousedown",
  () => {

    audio();

    startMusic();

    shoot();

  }
);


/* GAME */

function spawnBot() {

  const side =
    Math.floor(
      Math.random() * 4
    );

  let x;
  let y;

  if (side === 0) {

    x =
      70 +
      Math.random() * 760;

    y = 55;

  }

  else if (side === 1) {

    x =
      70 +
      Math.random() * 760;

    y = 505;

  }

  else if (side === 2) {

    x = 55;

    y =
      70 +
      Math.random() * 420;

  }

  else {

    x = 845;

    y =
      70 +
      Math.random() * 420;

  }


  bots.push({

    x,

    y,

    r: 14,

    hp: 2,

    speed:
      0.55 +
      Math.random() * 0.35,

    cooldown:
      70 +
      Math.random() * 80

  });

}


function reload() {

  if (
    player.reloading ||
    player.ammo === player.max
  ) {

    return;

  }

  player.reloading = true;

  tone(
    220,
    0.08,
    "triangle",
    0.018
  );

  setTimeout(() => {

    player.ammo =
      player.max;

    player.reloading = false;

    tone(
      440,
      0.1,
      "triangle",
      0.025
    );

  }, 850);

}


function shoot() {

  if (
    gameOver ||
    player.reloading
  ) {

    return;

  }


  if (player.ammo <= 0) {

    tone(
      95,
      0.06,
      "square",
      0.02
    );

    reload();

    return;

  }


  player.ammo--;

  flash = 5;


  tone(
    115,
    0.055,
    "sawtooth",
    0.035
  );


  const dx =
    mouse.x -
    player.x;

  const dy =
    mouse.y -
    player.y;

  const length =
    Math.hypot(
      dx,
      dy
    );


  for (
    let i = 0;
    i < bots.length;
    i++
  ) {

    const bot =
      bots[i];

    const bx =
      bot.x -
      player.x;

    const by =
      bot.y -
      player.y;


    if (
      Math.hypot(bx, by)
      < 650
    ) {

      const cross =
        Math.abs(
          dx * by -
          dy * bx
        ) /
        (length || 1);


      const dot =
        (
          dx * bx +
          dy * by
        ) /
        (
          length *
          (
            Math.hypot(
              bx,
              by
            ) || 1
          )
        );


      if (
        cross < 24 &&
        dot > 0.93
      ) {

        bot.hp--;

        score +=
          bot.hp <= 0
            ? 100
            : 25;


        tone(
          bot.hp <= 0
            ? 520
            : 300,
          0.09,
          "square",
          0.03
        );


        if (
          bot.hp <= 0
        ) {

          bots.splice(
            i,
            1
          );

          tone(
            760,
            0.12,
            "triangle",
            0.025
          );

        }

        break;

      }

    }

  }

}


function restart() {

  score = 0;

  round = 1;

  gameOver = false;

  player.hp = 100;

  player.ammo = 12;

  player.reloading = false;

  bots = [];


  for (
    let i = 0;
    i < 4;
    i++
  ) {

    spawnBot();

  }


  last =
    performance.now();

  startMusic();

  requestAnimationFrame(
    loop
  );

}


function update(dt) {

  let vx =
    (keys.d ? 1 : 0) -
    (keys.a ? 1 : 0);

  let vy =
    (keys.s ? 1 : 0) -
    (keys.w ? 1 : 0);


  const length =
    Math.hypot(
      vx,
      vy
    ) || 1;


  player.x +=
    vx / length *
    3.2 *
    dt;

  player.y +=
    vy / length *
    3.2 *
    dt;


  player.x =
    Math.max(
      30,
      Math.min(
        870,
        player.x
      )
    );

  player.y =
    Math.max(
      30,
      Math.min(
        530,
        player.y
      )
    );


  spawnTimer += dt;


  if (
    spawnTimer > 120 &&
    bots.length < 6
  ) {

    spawnTimer = 0;

    spawnBot();

  }


  for (
    const bot of bots
  ) {

    const dx =
      player.x -
      bot.x;

    const dy =
      player.y -
      bot.y;

    const distance =
      Math.hypot(
        dx,
        dy
      ) || 1;


    if (
      distance > 45
    ) {

      bot.x +=
        dx / distance *
        bot.speed *
        dt;

      bot.y +=
        dy / distance *
        bot.speed *
        dt;

    }


    bot.cooldown -= dt;


    if (
      distance < 230 &&
      bot.cooldown <= 0
    ) {

      player.hp -= 5;

      tone(
        85,
        0.12,
        "sawtooth",
        0.025
      );

      bot.cooldown =
        75 +
        Math.random() *
        70;

    }

  }


  if (
    player.hp <= 0
  ) {

    player.hp = 0;

    gameOver = true;

    stopMusic();

    tone(
      60,
      0.45,
      "sawtooth",
      0.045
    );

  }


  if (
    bots.length === 0
  ) {

    round++;

    for (
      let i = 0;
      i <
      3 +
      Math.min(
        round,
        5
      );
      i++
    ) {

      spawnBot();

    }

  }

}


/* DRAW */

function draw() {

  ctx.clearRect(
    0,
    0,
    900,
    560
  );


  ctx.fillStyle =
    "#2d3336";

  ctx.fillRect(
    0,
    0,
    900,
    560
  );


  ctx.fillStyle =
    "#383f43";

  ctx.fillRect(
    35,
    35,
    830,
    490
  );


  ctx.strokeStyle =
    "#4c555a";

  ctx.lineWidth = 3;

  ctx.strokeRect(
    35,
    35,
    830,
    490
  );


  /* COVER */

  ctx.fillStyle =
    "#1e2428";

  ctx.fillRect(
    190,
    120,
    180,
    32
  );

  ctx.fillRect(
    530,
    120,
    180,
    32
  );

  ctx.fillRect(
    190,
    405,
    180,
    32
  );

  ctx.fillRect(
    530,
    405,
    180,
    32
  );

  ctx.fillRect(
    420,
    205,
    60,
    150
  );


  /* SITES */

  ctx.strokeStyle =
    "#d3a83f";

  ctx.lineWidth = 2;

  ctx.strokeRect(
    70,
    70,
    130,
    100
  );

  ctx.strokeRect(
    700,
    390,
    130,
    100
  );


  ctx.fillStyle =
    "#d3a83f";

  ctx.font =
    "bold 20px Arial";

  ctx.fillText(
    "A",
    125,
    125
  );

  ctx.fillText(
    "B",
    755,
    445
  );


  /* BOTS */

  for (
    const bot of bots
  ) {

    ctx.fillStyle =
      "#d95757";

    ctx.beginPath();

    ctx.arc(
      bot.x,
      bot.y,
      bot.r,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  /* PLAYER */

  const angle =
    Math.atan2(
      mouse.y -
      player.y,
      mouse.x -
      player.x
    );


  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(angle);


  ctx.fillStyle =
    "#4e86d8";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    player.r,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle =
    "#222";

  ctx.fillRect(
    7,
    -4,
    20,
    8
  );


  ctx.restore();


  if (flash > 0) {

    ctx.fillStyle =
      "#ffe28a";

    ctx.beginPath();

    ctx.arc(
      player.x +
      Math.cos(angle) *
      31,

      player.y +
      Math.sin(angle) *
      31,

      8,
      0,
      Math.PI * 2
    );

    ctx.fill();

    flash--;

  }


  ctx.fillStyle =
    "white";

  ctx.font =
    "16px Arial";

  ctx.fillText(
    player.reloading
      ? "RELOADING..."
      : "Ammo: " +
        player.ammo +
        "/" +
        player.max,

    45,
    550
  );


  if (gameOver) {

    ctx.fillStyle =
      "rgba(0,0,0,.72)";

    ctx.fillRect(
      0,
      0,
      900,
      560
    );


    ctx.textAlign =
      "center";

    ctx.fillStyle =
      "white";

    ctx.font =
      "bold 44px Arial";

    ctx.fillText(
      "ROUND LOST",
      450,
      260
    );


    ctx.font =
      "22px Arial";

    ctx.fillText(
      "Press Enter or Restart to play again",
      450,
      305
    );


    ctx.textAlign =
      "left";

  }

}


/* LOOP */

function loop(time) {

  if (gameOver) {

    draw();

    return;

  }


  const dt =
    Math.min(
      (time - last) /
      16.67,
      2
    );


  last = time;


  update(dt);

  draw();


  document.getElementById(
    "score"
  ).textContent =
    score;

  document.getElementById(
    "hp"
  ).textContent =
    Math.max(
      0,
      player.hp
    );

  document.getElementById(
    "round"
  ).textContent =
    round;


  requestAnimationFrame(
    loop
  );

}


restart();

</script>

</body>
</html>
